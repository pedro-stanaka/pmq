name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'moto[server]==5.2.5'
      - run: scripts/test-s3-contract.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace @pmq-dev/example-vite
      - run: npm ci --prefix skills/pmq-app-builder/assets/templates/react-vite-ts
      - run: npm run build --prefix skills/pmq-app-builder/assets/templates/react-vite-ts
      - run: scripts/smoke-test.sh
