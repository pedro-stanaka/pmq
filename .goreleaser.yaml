# GoReleaser configuration for PMQ tagged releases (docs/distribution.md).
# Validate with `goreleaser check`; release by pushing a vX.Y.Z tag, which
# creates a draft GitHub release that a maintainer publishes manually.
version: 2

project_name: pmq

builds:
  - id: pmq
    main: ./cmd/pmq
    binary: pmq
    env:
      # modernc.org/sqlite is pure Go: cross-builds need no C toolchain.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    # Deterministic archives: fixed file times from the commit.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: pmq
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Supply-chain provenance (SLSA) is generated by actions/attest-build-provenance
# in .github/workflows/release.yml, attesting the artifacts GoReleaser leaves
# in dist/ against the tag's workflow run. Download verification is documented
# in docs/distribution.md.

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

release:
  # Never publish a release automatically: a maintainer reviews and publishes
  # the draft. This is the explicit authorization gate for public releases.
  draft: true
  mode: keep-existing
  header: |
    See [docs/distribution.md](https://github.com/pedro-stanaka/pmq/blob/main/docs/distribution.md)
    for download verification, installation, upgrades, and rollback.

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
