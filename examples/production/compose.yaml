services:
  pmq:
    # Build and publish the repository Dockerfile separately; pin a tested digest.
    image: ${PMQ_IMAGE:?Set PMQ_IMAGE to a tested image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PMQ_DOMAIN: ${PMQ_DOMAIN:?Set PMQ_DOMAIN}
      PMQ_DEPLOY_TOKEN: ${PMQ_DEPLOY_TOKEN:?Set PMQ_DEPLOY_TOKEN from a secret}
      PMQ_TRUSTED_PROXIES: ${PMQ_TRUSTED_PROXIES:?Set to the observed Caddy peer}
      PMQ_IDENTITY_HEADER: ${PMQ_IDENTITY_HEADER:-X-PMQ-User}
      PMQ_STORAGE_PROVIDER: ${PMQ_STORAGE_PROVIDER:-filesystem}
      PMQ_S3_ENDPOINT: ${PMQ_S3_ENDPOINT:-}
      PMQ_S3_REGION: ${PMQ_S3_REGION:-}
      PMQ_S3_BUCKET: ${PMQ_S3_BUCKET:-}
      PMQ_S3_ACCESS_KEY: ${PMQ_S3_ACCESS_KEY:-}
      PMQ_S3_SECRET_KEY: ${PMQ_S3_SECRET_KEY:-}
      PMQ_S3_SESSION_TOKEN: ${PMQ_S3_SESSION_TOKEN:-}
      PMQ_S3_INSECURE: ${PMQ_S3_INSECURE:-false}
      PMQ_S3_PATH_STYLE: ${PMQ_S3_PATH_STYLE:-false}
      PMQ_AI_PROVIDER: ${PMQ_AI_PROVIDER:-}
      PMQ_AI_MODELS: ${PMQ_AI_MODELS:-}
      PMQ_BEDROCK_MODELS: ${PMQ_BEDROCK_MODELS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - pmq-data:/data
    stop_grace_period: 15s
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/_pmq/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
volumes:
  pmq-data:
