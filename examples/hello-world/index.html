<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMQ Hello World</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Hello, PMQ</h1><p>Save a note in this application's document store.</p><form id="form"><label for="note">Note</label><input id="note" required maxlength="200"><button>Save</button></form><ul id="notes"></ul>
<section aria-labelledby="files-heading"><h2 id="files-heading">Object storage</h2><p>Upload a file to this app's private storage, then download or delete it.</p><form id="file-form"><label for="file">Choose a file</label><input id="file" type="file" required><button>Upload</button></form><ul id="files"></ul></section>
<section><h2>Ask the configured AI</h2><p>Requires PMQ AI provider configuration. The model is a server-configured model name or alias.</p><form id="ai-form"><label for="model">Model</label><input id="model" value="fast" required><label for="prompt">Prompt</label><input id="prompt" value="Say hello" required><button>Ask</button></form><p id="ai-error" role="alert"></p><pre id="answer"></pre></section>
<p id="error" role="alert" aria-live="polite"></p></main><script src="app.js" defer></script></body></html>
